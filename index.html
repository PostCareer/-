<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>快訊！全台首家上市檳榔公司</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #f4f4f9;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* 封面容器 */
        .card-container {
            max-width: 600px;
            width: 100%;
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.15);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .card-container:hover {
            transform: scale(1.02);
        }

        /* 標題樣式 */
        .news-title {
            background-color: #e60000;
            color: #ffffff;
            font-size: 22px;
            font-weight: bold;
            padding: 15px 20px;
            text-align: center;
            letter-spacing: 1px;
        }

        /* 圖片區域 */
        .image-wrapper {
            width: 100%;
            position: relative;
        }

        .image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* 內容與引導按鈕 */
        .news-content {
            padding: 20px;
            text-align: center;
        }

        .news-desc {
            font-size: 16px;
            color: #333333;
            margin-bottom: 15px;
            line-height: 1.5;
        }

        .click-btn {
            display: inline-block;
            background-color: #28a745;
            color: white;
            padding: 12px 24px;
            font-size: 16px;
            font-weight: bold;
            border-radius: 6px;
            text-decoration: none;
            box-shadow: 0 2px 5px rgba(0,0,0,0.2);
        }

        /* 第二張圖的隱藏/顯示狀態 */
        #prank-page {
            display: none;
            text-align: center;
            width: 100%;
            max-width: 600px;
        }

        #prank-page img {
            width: 100%;
            max-width: 500px;
            height: auto;
            border-radius: 10px;
        }
    </style>
</head>
<body>

    <!-- 第一頁：新聞封面 -->
    <div id="cover-page" class="card-container" onclick="showPrank()">
        <div class="news-title">
            快訊！全台首家上市檳榔公司
        </div>
        <div class="image-wrapper">
            <!-- 請將 src 替換為你的第一張檳榔攤圖片檔名或連結 -->
            <img src="IMG_0463.jpeg" alt="強勇連鎖加盟檳榔攤">
        </div>
        <div class="news-content">
            <p class="news-desc">勇於創造檳榔奇蹟！即刻點擊查看上市公司完整招股說明與股價資訊。</p>
            <div class="click-btn">點擊查看詳情 ➔</div>
        </div>
    </div>

    <!-- 第二頁：點進去顯示的梗圖 -->
    <div id="prank-page">
        <!-- 請將 src 替換為你的第二張梗圖檔名或連結 -->
        <img src="IMG_0453.png" alt="梗圖">
    </div>

    <script>
        function showPrank() {
            // 隱藏封面，顯示梗圖
            document.getElementById('cover-page').style.display = 'none';
            document.getElementById('prank-page').style.display = 'block';
        }
    </script>

</body>
</html>
