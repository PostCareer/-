<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【最新快訊】台中市明日停止上班上課</title>
    
    <!-- LINE / FB 分享時顯示的預覽文字與卡片 -->
    <meta property="og:title" content="【颱風快訊】台中市明日宣布停止上班停止上課！">
    <meta property="og:description" content="因應颱風最新動向與風雨預測，台中市政府剛剛正式宣布明日全市停止上班、停止上課...">
    <meta property="og:type" content="website">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #121212;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            padding: 12px;
        }
        .news-card {
            background-color: #1e1e1e;
            max-width: 500px;
            width: 100%;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 8px 24px rgba(0,0,0,0.5);
            border: 1px solid #333;
        }
        .header-bar {
            background-color: #cc0000;
            color: #ffffff;
            padding: 8px 16px;
            font-size: 14px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            letter-spacing: 1px;
        }
        .header-bar .live-badge {
            background-color: #ffffff;
            color: #cc0000;
            padding: 2px 6px;
            border-radius: 4px;
            font-size: 12px;
            animation: blink 1.2s infinite;
        }
        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }
        .news-content {
            padding: 20px 16px;
        }
        .news-title {
            color: #ff4d4d;
            font-size: 22px;
            font-weight: 900;
            line-height: 1.4;
            margin-bottom: 12px;
        }
        .news-time {
            font-size: 12px;
            color: #888888;
            margin-bottom: 16px;
            border-bottom: 1px solid #333;
            padding-bottom: 8px;
        }
        .img-container {
            width: 100%;
            border-radius: 8px;
            overflow: hidden;
            background-color: #000;
        }
        .img-container img {
            width: 100%;
            height: auto;
            display: block;
        }
        .footer-bar {
            background-color: #2a2a2a;
            padding: 10px 16px;
            font-size: 12px;
            color: #aaa;
            text-align: center;
        }
    </style>
</head>
<body>

<div class="news-card">
    <div class="header-bar">
        <span>🚨 突發新聞快訊</span>
        <span class="live-badge">LIVE 即時</span>
    </div>
    
    <div class="news-content">
        <div class="news-title">快訊／台中市明日停止上班、停止上課！</div>
        <div class="news-time">發布時間：2026年9月3日 21:55 即時報導</div>
        
        <div class="img-container">
            <!-- 記得確認圖片檔名是否與你上傳的照片檔名一致（例：news.jpg） -->
            <img src="news.jpg" alt="颱風快訊最新畫面">
        </div>
    </div>

    <div class="footer-bar">
                新聞台 ‧ 獨家報導
    </div>
</div>

</body>
</html>
